<!DOCTYPE html>
<html>
<head>
    <title>Attendance Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            text-align: center;
        }

        .attendance {
            font-size: 32px;
            font-weight: bold;
            margin: 20px;
        }

        .status {
            font-size: 22px;
            font-weight: bold;
        }

        a {
            display: block;
            margin-top: 20px;
            text-decoration: none;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Attendance Result</h1>

    <h2 th:text="${studentName}"></h2>

    <p>Total Classes: <span th:text="${totalClasses}"></span></p>

    <p>Classes Attended: <span th:text="${attendedClasses}"></span></p>

    <div class="attendance">
        <span th:text="${attendance}"></span>%
    </div>

    <div class="status">
        <span th:text="${status}"></span>
    </div>

    <a href="/">Calculate Again</a>

</div>

</body>
</html>
