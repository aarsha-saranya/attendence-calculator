<!DOCTYPE html>
<html>
<head>
    <title>Attendance Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Attendance Calculator</h1>

    <form action="/calculate" method="post">

        <label>Student Name:</label>
        <input type="text" name="studentName" required>

        <label>Total Classes:</label>
        <input type="number" name="totalClasses" min="1" required>

        <label>Classes Attended:</label>
        <input type="number" name="attendedClasses" min="0" required>

        <button type="submit">Calculate Attendance</button>

    </form>

</div>

</body>
</html>
